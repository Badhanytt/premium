<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Billionaire Lounge - Executive Private Messenger</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --bg-dark: #08080a;
            --card-dark: #121318;
            --card-accent: #1a1b23;
            --text-gold: #f3e5ab;
            --text-light: #e4e6eb;
            --border-gold: rgba(212, 175, 55, 0.35);
            --gold-glow: 0 0 20px rgba(212, 175, 55, 0.4);
            --neon-green: #00ff87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Royal Header */
        header {
            background: rgba(18, 19, 24, 0.98);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-gold);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-shrink: 0;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            user-select: none;
        }

        .brand-logo i {
            color: var(--gold-primary);
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Upgraded VIP Balance Badge */
        .balance-card {
            background: linear-gradient(145deg, #181a22, #0d0e12);
            border: 1.5px solid var(--gold-primary);
            padding: 8px 18px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--gold-glow);
            transition: all 0.3s ease;
        }

        .balance-card i { 
            color: var(--neon-green);
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px rgba(0, 255, 135, 0.6));
        }

        .balance-amount {
            color: var(--gold-light);
            font-weight: 900;
            font-size: 1.25rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(243, 229, 171, 0.4);
        }

        /* Admin Mode Pill */
        .admin-indicator {
            display: none;
            background: var(--gold-gradient);
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* VIP Banner */
        .auto-delete-banner {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.12), rgba(0, 0, 0, 0.95), rgba(212, 175, 55, 0.12));
            color: var(--gold-light);
            font-size: 0.82rem;
            text-align: center;
            padding: 7px;
            border-bottom: 1px solid var(--border-gold);
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        /* Main App Layout */
        .chat-app-container {
            display: flex;
            flex: 1;
            height: 100%;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 310px;
            background: var(--card-dark);
            border-right: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .sidebar.hidden-user {
            display: none !important;
        }

        .sidebar-header {
            padding: 16px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--gold-primary);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .user-item {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: rgba(212, 175, 55, 0.15);
            border-left: 4px solid var(--gold-primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            font-size: 0.9rem;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #15161d 0%, #08080a 100%);
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .chat-header {
            padding: 14px 20px;
            background: var(--card-dark);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .chat-user-details {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back-users {
            display: none;
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--gold-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chat-header h4 {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .vip-badge {
            color: #1da1f2;
            font-size: 0.9rem;
        }

        .btn-add-balance {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 7px 15px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        /* Message Rows */
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }

        .message-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .sender-info {
            font-size: 0.75rem;
            color: var(--gold-primary);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            position: relative;
            word-break: break-word;
            line-height: 1.5;
        }

        .message-row.sent .message-bubble {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 600;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.25);
        }

        .message-row.received .message-bubble {
            background: var(--card-accent);
            color: var(--text-light);
            border: 1px solid var(--border-gold);
            border-bottom-left-radius: 4px;
        }

        .message-timer {
            font-size: 0.7rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        .message-row.sent .message-timer { color: #111; }
        .message-row.received .message-timer { color: var(--gold-primary); }

        .status-waiting {
            color: #888;
            font-style: italic;
        }

        /* Input Area */
        .chat-input-area {
            padding: 14px 20px;
            background: var(--card-dark);
            border-top: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1.5px solid var(--border-gold);
            outline: none;
            background: var(--bg-dark);
            color: var(--gold-light);
            font-size: 0.95rem;
        }

        .chat-input::placeholder {
            color: rgba(243, 229, 171, 0.4);
        }

        .btn-send {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .btn-send:active {
            transform: scale(0.92);
        }

        /* Mobile View Fixes */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                width: 100%;
                height: 100%;
                left: 0;
                top: 0;
            }
            .sidebar.mobile-hide {
                display: none !important;
            }
            .btn-back-users {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-logo" id="brandLogo" onclick="handleSecretAdminClick()">
            <i class="fa-solid fa-crown"></i>
            <span>Billionaire Lounge</span>
        </div>

        <div class="header-controls">
            <div class="balance-card">
                <i class="fa-solid fa-wallet"></i>
                <span class="balance-amount" id="lblUserBalance">$0.00</span>
            </div>

            <div id="adminIndicator" class="admin-indicator" onclick="exitAdminMode()">
                👑 Exit Executive Control
            </div>
        </div>
    </header>

    <!-- Banner -->
    <div class="auto-delete-banner">
        <i class="fa-solid fa-user-shield"></i> <b>END-TO-END ENCRYPTED:</b> উত্তর প্রদানের ১ মিনিট ($60\text{s}$) পর বার্তা স্বয়ংক্রিয়ভাবে মুছে যাবে।
    </div>

    <!-- Container -->
    <div class="chat-app-container">
        <!-- Sidebar -->
        <div class="sidebar hidden-user" id="adminSidebar">
            <div class="sidebar-header">
                <span>👑 VIP Billionaire Clients</span>
            </div>
            <ul class="user-list" id="adminUserList"></ul>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div class="chat-user-details">
                    <button class="btn-back-users" id="btnBackUsers" onclick="showAdminUserList()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="user-avatar" id="activeAvatar">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div>
                        <h4 id="activeChatTitle">
                            Chairman & CEO Desk <i class="fa-solid fa-circle-check vip-badge"></i>
                        </h4>
                        <small id="userStatusSub" style="color: var(--neon-green); font-size: 0.78rem;">● Secured Direct Line Active</small>
                    </div>
                </div>

                <div id="adminActionBox" style="display: none;">
                    <button class="btn-add-balance" onclick="giveBalanceToUser()">
                        <i class="fa-solid fa-pen-to-square"></i> Update Balance
                    </button>
                </div>
            </div>

            <!-- Messages Box -->
            <div class="chat-messages" id="chatMessages"></div>

            <!-- Input Box -->
            <div class="chat-input-area">
                <input type="text" id="messageInput" class="chat-input" placeholder="বোর্ড চেয়ারম্যানের জন্য গোপন বার্তা লিখুন..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqG0TFBK-0ZM5IjTwU4VC39esnCDsShI0",
            authDomain: "trounament-d8110.firebaseapp.com",
            databaseURL: "https://trounament-d8110-default-rtdb.firebaseio.com",
            projectId: "trounament-d8110",
            storageBucket: "trounament-d8110.firebasestorage.app",
            messagingSenderId: "882962094817",
            appId: "1:882962094817:web:111ac2630cc2a4199db5a0",
            measurementId: "G-FB2ZY0MLFG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRole = "user"; 
        const DELETE_DELAY_MS = 60 * 1000; // 1 minute countdown after reply

        function getDeviceUID() {
            let id = localStorage.getItem("permanent_vip_device_id");
            if (!id) {
                id = "VIP_" + Math.floor(100000 + Math.random() * 900000);
                localStorage.setItem("permanent_vip_device_id", id);
            }
            return id;
        }

        let myUserId = getDeviceUID();
        let selectedChatUser = myUserId;

        // Save new user profile if not exist
        const userRef = ref(db, `users/${myUserId}`);
        get(userRef).then((snapshot) => {
            if (!snapshot.exists()) {
                set(userRef, {
                    userId: myUserId,
                    balance: 0.00,
                    joinedAt: Date.now()
                });
            }
        });

        // Realtime Balance update for User Header
        onValue(ref(db, `users/${myUserId}/balance`), (snap) => {
            const bal = snap.val() || 0.00;
            document.getElementById("lblUserBalance").innerText = "$" + parseFloat(bal).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        });

        // Secret Admin Entrance
        let clickCount = 0;
        let clickTimer = null;

        window.handleSecretAdminClick = function() {
            clickCount++;
            clearTimeout(clickTimer);

            if (clickCount >= 3) {
                clickCount = 0;
                let pass = prompt("🔐 Enter Executive Access Key:");
                if (pass === "admin1234") {
                    enterAdminMode();
                } else if (pass !== null) {
                    alert("❌ Invalid Authorization Key!");
                }
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            }
        };

        function enterAdminMode() {
            currentRole = "admin";
            const sidebar = document.getElementById("adminSidebar");
            sidebar.classList.remove("hidden-user");
            sidebar.classList.remove("mobile-hide");
            document.getElementById("adminActionBox").style.display = "block";
            document.getElementById("adminIndicator").style.display = "block";
            listenUserListAdmin();
        }

        window.exitAdminMode = function() {
            currentRole = "user";
            const sidebar = document.getElementById("adminSidebar");
            sidebar.classList.add("hidden-user");
            document.getElementById("adminActionBox").style.display = "none";
            document.getElementById("adminIndicator").style.display = "none";
            document.getElementById("btnBackUsers").style.display = "none";
            selectedChatUser = myUserId;
            setupUserHeader();
            listenMessages();
        };

        window.showAdminUserList = function() {
            if (currentRole !== "admin") return;
            const sidebar = document.getElementById("adminSidebar");
            sidebar.classList.remove("mobile-hide");
        };

        function setupUserHeader() {
            document.getElementById("activeChatTitle").innerHTML = `Chairman & CEO Desk <i class="fa-solid fa-circle-check vip-badge"></i>`;
            document.getElementById("userStatusSub").innerText = "● Secured Direct Line Active";
            document.getElementById("messageInput").placeholder = "বোর্ড চেয়ারম্যানের জন্য গোপন বার্তা লিখুন...";
        }

        // Admin Edit Balance
        window.giveBalanceToUser = function() {
            if (currentRole !== "admin" || !selectedChatUser) return;
            
            get(ref(db, `users/${selectedChatUser}/balance`)).then((snap) => {
                let currentBal = snap.val() || 0;
                let amount = prompt(`VIP Client [${selectedChatUser}]-এর বর্তমান ক্রেডিট: $${currentBal}\n\nনতুন ব্যালেন্স কত প্রদান করতে চান? ($):`, currentBal);
                let parsedAmount = parseFloat(amount);

                if (!isNaN(parsedAmount) && parsedAmount >= 0) {
                    update(ref(db, `users/${selectedChatUser}`), {
                        balance: parsedAmount
                    }).then(() => {
                        alert(`✅ Client ${selectedChatUser}-এর নতুন ফান্ড যুক্ত হয়েছে: $${parsedAmount}`);
                        document.getElementById("userStatusSub").innerText = `Client Balance: $${parsedAmount.toFixed(2)}`;
                    });
                }
            });
        };

        // Send Message with Intelligent Expiry Tracking
        window.sendMessage = function() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            const chatRoomId = currentRole === "admin" ? selectedChatUser : myUserId;
            const messagesRef = ref(db, `chats/${chatRoomId}`);
            
            // Check previous unreplied messages from opposite party to activate their timer
            get(messagesRef).then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach((msgId) => {
                        const m = data[msgId];
                        // If reply is given, start expiry countdown for messages that haven't expired yet
                        if (m.sender !== currentRole && !m.expireAt) {
                            update(ref(db, `chats/${chatRoomId}/${msgId}`), {
                                expireAt: Date.now() + DELETE_DELAY_MS
                            });
                        }
                    });
                }

                // Push current message
                const newMsgRef = push(messagesRef);
                const msgData = {
                    sender: currentRole,
                    text: text,
                    timestamp: Date.now(),
                    expireAt: null // Will remain null until opposite party replies!
                };

                set(newMsgRef, msgData).then(() => {
                    input.value = "";
                });
            });
        };

        window.handleKeyPress = function(e) {
            if (e.key === "Enter") sendMessage();
        };

        // Admin User List
        function listenUserListAdmin() {
            onValue(ref(db, 'users'), (snapshot) => {
                const list = document.getElementById("adminUserList");
                list.innerHTML = "";
                const users = snapshot.val();

                if (!users) {
                    list.innerHTML = "<li style='padding:15px; color:#888;'>কোনো VIP মক্কেলের তালিকা পাওয়া যায়নি</li>";
                    return;
                }

                for (let uid in users) {
                    const u = users[uid];
                    const item = document.createElement("li");
                    item.className = `user-item ${selectedChatUser === uid ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="user-info">
                            <div class="user-avatar">${uid.substring(0, 4)}</div>
                            <div>
                                <strong style="color:var(--gold-light);">${uid}</strong>
                                <br><small style="color:var(--neon-green);">Credit: $${(u.balance || 0).toFixed(2)}</small>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        selectedChatUser = uid;
                        document.getElementById("activeChatTitle").innerHTML = `Client ID: ${uid} <i class="fa-solid fa-circle-check vip-badge"></i>`;
                        document.getElementById("userStatusSub").innerText = `Client Balance: $${(u.balance || 0).toFixed(2)}`;
                        document.getElementById("messageInput").placeholder = `${uid}-কে প্রাইভেট উত্তর পাঠান...`;
                        
                        if (window.innerWidth <= 768) {
                            document.getElementById("adminSidebar").classList.add("mobile-hide");
                            document.getElementById("btnBackUsers").style.display = "flex";
                        }

                        listenUserListAdmin();
                        listenMessages();
                    };
                    list.appendChild(item);
                }
            });
        }

        // Realtime Messages Engine
        function listenMessages() {
            const targetUser = currentRole === "admin" ? selectedChatUser : myUserId;
            if (!targetUser) return;

            onValue(ref(db, `chats/${targetUser}`), (snapshot) => {
                const container = document.getElementById("chatMessages");
                container.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = "<div style='text-align:center; color:#888; margin-top:20px;'><i class='fa-solid fa-lock'></i> এনক্রিপ্টেড প্রাইভেট চ্যানেল প্রস্তুত। আপনার বার্তা পাঠান...</div>";
                    return;
                }

                const now = Date.now();

                Object.keys(data).forEach((msgId) => {
                    const msg = data[msgId];

                    // Realtime Auto-Delete check on expireAt
                    if (msg.expireAt && now >= msg.expireAt) {
                        remove(ref(db, `chats/${targetUser}/${msgId}`));
                        return;
                    }

                    const isSentByMe = (currentRole === "admin" && msg.sender === "admin") || 
                                       (currentRole === "user" && msg.sender === "user");

                    const row = document.createElement("div");
                    row.className = `message-row ${isSentByMe ? 'sent' : 'received'}`;

                    let timerText = "";
                    if (msg.expireAt) {
                        const remainingSeconds = Math.max(0, Math.floor((msg.expireAt - now) / 1000));
                        timerText = `<i class="fa-regular fa-clock"></i> <span class="time-count" data-expire="${msg.expireAt}">${remainingSeconds}s</span> (মুছে যাচ্ছে)`;
                    } else {
                        timerText = `<i class="fa-solid fa-check-double"></i> <span class="status-waiting">উত্তর পাওয়ার অপেক্ষায়...</span>`;
                    }

                    row.innerHTML = `
                        <div class="sender-info">${msg.sender === 'admin' ? '👑 Chairman & CEO' : '👤 VIP Client'}</div>
                        <div class="message-bubble">
                            ${escapeHTML(msg.text)}
                            <div class="message-timer">
                                ${timerText}
                            </div>
                        </div>
                    `;

                    container.appendChild(row);
                });

                container.scrollTop = container.scrollHeight;
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&#34;' }[tag] || tag)
            );
        }

        // Timer Loop
        setInterval(() => {
            const now = Date.now();
            const timers = document.querySelectorAll(".time-count");
            timers.forEach((span) => {
                const expireAt = parseInt(span.getAttribute("data-expire"));
                if (expireAt) {
                    let secs = Math.max(0, Math.floor((expireAt - now) / 1000));
                    if (secs > 0) {
                        span.innerText = secs + "s";
                    } else {
                        span.innerText = "Deleting...";
                    }
                }
            });
        }, 1000);

        // App Init
        setupUserHeader();
        listenMessages();
    </script>
</body>
</html>
